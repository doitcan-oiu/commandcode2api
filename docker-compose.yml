services:
  proxy:
    build:
      context: .
    ports:
      - "${PROXY_PORT:-3050}:3050"
    environment:
      PORT: "3050"
      HOST: "0.0.0.0"
      CC_CHECK_PROTOCOL_DRIFT: "${CC_CHECK_PROTOCOL_DRIFT:-true}"
    volumes:
      - ./configs/config.json:/app/configs/config.json:ro
      - gateway-data:/app/data
    restart: unless-stopped

volumes:
  gateway-data:
